server
{
    listen 80;
    server_name ace.iiiu.im;

    # ACME challenge（以后换 Let's Encrypt 正式证书用）
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
        root /www/wwwroot/ace.iiiu.im;
    }

    # 不做 https 跳转：兼容 Cloudflare Flexible 回源，避免重定向循环
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server
{
    listen 443 ssl;
    http2 on;
    server_name ace.iiiu.im;

    # 自签证书：Cloudflare Full（非严格）模式下可正常回源
    ssl_certificate /opt/poker-tools/deploy/ace.iiiu.im.crt;
    ssl_certificate_key /opt/poker-tools/deploy/ace.iiiu.im.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
